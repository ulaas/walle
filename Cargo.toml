[package]
name = "walle"
version = "0.7.2"
edition = "2024"
description = "Browse, tag, curate and set wallpapers from online services"
license = "MIT"
repository = "https://github.com/ulaas/walle"
homepage = "https://ulaas.github.io/walle/"
readme = "README.md"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
directories = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
urlencoding = "2"
rfd = "0.17"
# The update check: checksums of downloads, and the executable out of a release archive.
sha2 = "0.10"
flate2 = "1"

[features]
# Lets WALLE_UPDATE_FEED point the updater at a local stand-in for GitHub, to try the whole
# update on a computer (src/update.rs). Never enabled in a release.
test-feed = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
tray-icon = "0.26"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# The tray icon: a StatusNotifierItem on the session bus.
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The wallpaper: NSWorkspace's desktop image of each NSScreen, asked for on the main thread;
# and the app's activation, to bring back a window hidden in the menu bar.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSCell", "NSResponder", "NSScreen", "NSWorkspace"] }
dispatch2 = "0.3"
block2 = "0.6"
# The menu bar item, as the tray icon on Windows.
tray-icon = "0.26"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
