# Builds walle for Windows and Linux when a version tag is pushed, and publishes
# them as a GitHub release with their SHA-256 checksums.
#
#   1. Set `version` in Cargo.toml, commit, push.
#   2. git tag -a v<version> -m "walle <version>" && git push origin v<version>
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: walle-windows-x64
            os: windows-latest
            platform: windows-x64
          - name: walle-linux-x64
            os: ubuntu-24.04
            platform: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # The tag is the version people see; the build must agree with it.
      - name: Check that the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      - name: Package
        shell: bash
        run: |
          name="walle-$VERSION-${{ matrix.platform }}"
          mkdir -p "dist/$name/licenses"
          cp README.md LICENSE "dist/$name/"
          cp assets/fonts/OFL.txt "dist/$name/licenses/Inter-OFL.txt"
          cp assets/fonts/Phosphor-LICENSE.txt "dist/$name/licenses/Phosphor-LICENSE.txt"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp ../target/release/walle.exe "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp ../target/release/walle "$name/"
            cp ../assets/logo.svg "$name/walle.svg"
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum walle-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--verify-tag --generate-notes --title "walle ${GITHUB_REF_NAME#v}")
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" walle-* SHA256SUMS.txt
