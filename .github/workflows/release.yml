# Builds walle for Windows, Linux and macOS when a version tag is pushed, and publishes
# them as a GitHub release with their SHA-256 checksums.
#
#   1. Set `version` in Cargo.toml, commit, push.
#   2. git tag -a v<version> -m "walle <version>" && git push origin v<version>
name: Release

# Run by hand (Actions > Release > Run workflow) it builds and packs everything
# and keeps the files as workflow artifacts, without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # secrets can't be read in step conditions; this can.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: walle-windows-x64
            os: windows-latest
            platform: windows-x64
          - name: walle-linux-x64
            os: ubuntu-24.04
            platform: linux-x64
          - name: walle-macos-arm64
            os: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # The tag is the version people see; the build must agree with it.
      - name: Check that the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      - name: Install WiX (MSI installer)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Install rsvg-convert (app icon)
        if: runner.os == 'macOS'
        run: brew install librsvg

      # Developer ID signing and notarization when the repository has the secrets (forks and
      # pull requests don't); without them the app is signed ad hoc. The certificate and an App
      # Store Connect API key go into a temporary keychain, as the notarytool profile ci-notary.
      - name: Import the Developer ID certificate and the notary key
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(uuidgen)"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -qF "$IDENTITY"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials ci-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$kc"
          rm -f "$RUNNER_TEMP/notary.p8"
          {
            echo "MACOS_SIGN_IDENTITY=$IDENTITY"
            echo "MACOS_NOTARY_PROFILE=ci-notary"
          } >> "$GITHUB_ENV"

      # Zip and MSI on Windows; tarball, .deb and .rpm on Linux; a disk image on macOS.
      - name: Package
        shell: bash
        env:
          WALLE_PACKAGE_STRICT: "1"
        run: scripts/package.sh "$VERSION" "${{ matrix.platform }}" dist

      - name: Gatekeeper accepts the notarized disk image
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        run: spctl --assess --type open --context context:primary-signature --verbose=2 dist/walle-*.dmg
      - name: Remove the temporary keychain
        if: always() && runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/walle-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum walle-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--verify-tag --generate-notes --title "walle ${GITHUB_REF_NAME#v}")
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" walle-* SHA256SUMS.txt
